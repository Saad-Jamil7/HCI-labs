<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 07 - Keyboard Reaction Time | Saad Jamil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>⌨️ Keyboard Reaction Time Test</h1>
    <p class="subtitle">Press <kbd>A</kbd> for LETTER | Press <kbd>L</kbd> for NUMBER</p>
    
    <div class="stimulus-box" id="stimulus">
        ?
    </div>
    
    <div class="info-panel">
        <div class="info-item">
            <span class="label">📊 Trial:</span>
            <span class="value" id="trialCount">0</span>
            <span class="label">/ 10</span>
        </div>
        <div class="info-item">
            <span class="label">✅ Correct:</span>
            <span class="value" id="correctCount">0</span>
        </div>
        <div class="info-item">
            <span class="label">⏱️ Last RT:</span>
            <span class="value" id="lastRT">—</span>
            <span class="label">ms</span>
        </div>
        <div class="info-item">
            <span class="label">📈 Average RT:</span>
            <span class="value" id="avgRT">—</span>
            <span class="label">ms</span>
        </div>
    </div>
    
    <div class="status" id="status">
        ⚡ Press SPACE to start
    </div>
    
    <div class="note">
        💡 Keep fingers on <kbd>A</kbd> (Letter) and <kbd>L</kbd> (Number)
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
